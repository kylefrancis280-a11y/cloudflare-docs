# Root Netlify config — pins the deploy to /shotbreak/.
# Without this, Netlify can auto-detect the placeholder Astro project at the
# repo root and deploy an empty dist/ instead of the SHOTBREAK app.
# `base = "shotbreak"` makes Netlify cd into shotbreak/ before doing anything,
# so shotbreak/netlify.toml (functions, included_files) takes effect normally
# and shotbreak/ becomes the publish root by default.

[build]
  base = "shotbreak"
