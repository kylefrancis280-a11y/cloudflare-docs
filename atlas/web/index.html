<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--bg-0:#06080f;--bg-1:#0b0e18;--bg-2:#10142a;--bg-3:#161c38;--bg-hover:#1a2040;
--border:#1a2045;--border-h:#253065;--border-accent:rgba(79,143,255,.25);
--tx-0:#eaf0ff;--tx-1:#a0b0d0;--tx-2:#607090;
--ac:#4f8fff;--ac-h:#3a75e8;--ac-glow:rgba(79,143,255,.12);--ac-strong:rgba(79,143,255,.25);
--green:#00e088;--green-bg:rgba(0,224,136,.08);--green-bd:rgba(0,224,136,.2);
--red:#ff4466;--red-bg:rgba(255,68,102,.08);--red-bd:rgba(255,68,102,.2);
--amber:#ffb020;--amber-bg:rgba(255,176,32,.08);
--purple:#a855f7;--cyan:#22d3ee;--orange:#fb923c;--pink:#f472b6;
--r:14px;--r-sm:10px;--r-lg:20px;
--font:'DM Sans',system-ui,-apple-system,sans-serif;
--mono:'IBM Plex Mono','SF Mono',monospace;
--display:'Playfair Display',Georgia,serif;
--sidebar:264px;--topbar:56px;
--mining:#fb923c;--ai:#a855f7;--tech:#22d3ee;--biotech:#00e088;--energy:#ffb020;--defense:#4f8fff;--media:#ec4899;--other:#6366f1;
}
[data-theme="light"]{
--bg-0:#eef0f5;--bg-1:#f5f6fa;--bg-2:#f9fafb;--bg-3:#eceef5;--bg-hover:#e2e5f0;
--border:#d4d9e8;--border-h:#bcc3d6;--border-accent:rgba(37,99,235,.18);
--tx-0:#0f172a;--tx-1:#3f4f6a;--tx-2:#7a879e;
--ac:#2563eb;--ac-h:#1d4ed8;--ac-glow:rgba(37,99,235,.07);--ac-strong:rgba(37,99,235,.12);
--green:#059669;--green-bg:rgba(5,150,105,.07);--green-bd:rgba(5,150,105,.18);
--red:#dc2626;--red-bg:rgba(220,38,38,.07);--red-bd:rgba(220,38,38,.18);
--amber:#d97706;--amber-bg:rgba(217,119,6,.07);
}
html{font-size:16px;scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg-0);color:var(--tx-0);line-height:1.55;overflow-x:hidden;transition:background .35s,color .35s}
a{color:var(--ac);text-decoration:none}
input,select,button,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--ac-strong);color:var(--tx-0)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--border-h)}

/* ─── Keyframes ─── */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideR{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:translateX(0)}}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,224,136,.4)}70%{box-shadow:0 0 0 8px rgba(0,224,136,0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.anim-fade{animation:fadeUp .5s ease both}
.anim-slide{animation:slideR .4s ease both}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}
.d4{animation-delay:.2s}.d5{animation-delay:.25s}.d6{animation-delay:.3s}
.mono{font-family:var(--mono)}

/* ─── Logo SVG ─── */
.atlas-logo{display:inline-flex;align-items:center;gap:10px}
.atlas-logo svg{flex-shrink:0}
.atlas-logo-text{display:flex;flex-direction:column;line-height:1}
.atlas-logo-main{font-family:var(--mono);font-weight:700;font-size:17px;letter-spacing:4px;color:var(--tx-0)}
.atlas-logo-sub{font-size:9px;letter-spacing:3.5px;color:var(--tx-2);text-transform:uppercase;margin-top:1px}

/* ─── Buttons ─── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:var(--r-sm);font-weight:600;font-size:13.5px;border:none;cursor:pointer;transition:all .2s;white-space:nowrap;text-decoration:none}
.btn-ac{background:var(--ac);color:#fff}.btn-ac:hover{background:var(--ac-h);transform:translateY(-1px);box-shadow:0 6px 20px rgba(79,143,255,.25)}
.btn-ol{background:transparent;border:1px solid var(--border);color:var(--tx-1)}.btn-ol:hover{border-color:var(--ac);color:var(--ac)}
.btn-ghost{background:transparent;color:var(--tx-2);padding:8px 12px;font-size:13px;border:none}.btn-ghost:hover{color:var(--tx-0);background:var(--ac-glow)}
.btn-sm{padding:8px 16px;font-size:12.5px}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{opacity:.9}
.btn-full{width:100%}

/* ─── Inputs ─── */
.inp{width:100%;padding:12px 14px;background:var(--bg-0);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--tx-0);font-size:14px;transition:all .2s}
.inp:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-glow)}
.inp::placeholder{color:var(--tx-2)}
.inp-label{display:block;font-size:11.5px;font-weight:600;color:var(--tx-2);margin-bottom:6px;letter-spacing:.8px;text-transform:uppercase}
.inp-group{margin-bottom:16px}

/* ─── Cards ─── */
.card{background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r);transition:all .2s;overflow:hidden}
.card:hover{border-color:var(--border-h)}
.card-glow:hover{border-color:var(--border-accent);box-shadow:0 4px 24px rgba(79,143,255,.06)}

/* ─── Tags ─── */
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;font-family:var(--mono);letter-spacing:.3px}

/* ─── Landing ─── */
.land-wrap{min-height:100vh;display:flex;flex-direction:column}
.land-head{position:sticky;top:0;z-index:50;backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);background:rgba(6,8,15,.75);border-bottom:1px solid var(--border)}
[data-theme="light"] .land-head{background:rgba(238,240,245,.88)}
.land-nav{max-width:1180px;margin:0 auto;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between}
.hero{position:relative;overflow:hidden;padding:80px 24px 60px}
.hero-inner{max-width:1180px;margin:0 auto;position:relative;z-index:2}
.hero-bg{position:absolute;inset:0;background:
radial-gradient(ellipse 70% 50% at 20% 30%,rgba(79,143,255,.1),transparent),
radial-gradient(ellipse 50% 60% at 80% 70%,rgba(168,85,247,.06),transparent);pointer-events:none}
.hero-mesh{position:absolute;inset:0;opacity:.08;background-image:
linear-gradient(rgba(79,143,255,.3) 1px,transparent 1px),
linear-gradient(90deg,rgba(79,143,255,.3) 1px,transparent 1px);
background-size:64px 64px;pointer-events:none}
.hero-kicker{display:inline-flex;align-items:center;gap:8px;background:var(--ac-glow);border:1px solid var(--border-accent);border-radius:24px;padding:7px 16px;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--ac);font-family:var(--mono);margin-bottom:24px}
.hero-kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
.hero-h1{font-family:var(--display);font-size:clamp(2.2rem,5.5vw,4rem);font-weight:900;line-height:1.08;letter-spacing:-.02em;margin-bottom:20px}
.hero-h1 em{font-style:normal;background:linear-gradient(135deg,var(--ac),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-p{font-size:clamp(.95rem,1.8vw,1.1rem);color:var(--tx-1);max-width:520px;line-height:1.7;margin-bottom:36px}
.hero-btns{display:flex;flex-wrap:wrap;gap:12px}

/* Stats strip */
.stats-strip{border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--bg-1)}
.stats-inner{max-width:1180px;margin:0 auto;padding:16px 24px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat{display:flex;align-items:center;gap:10px}
.stat-val{font-size:19px;font-weight:800;font-family:var(--mono);line-height:1}
.stat-lbl{font-size:11px;color:var(--tx-2)}

/* Preview grid */
.prev-sec{max-width:1180px;margin:0 auto;padding:48px 24px 40px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.sec-title{font-size:20px;font-weight:700}
.sec-sub{font-size:13px;color:var(--tx-2);margin-top:3px}
.prev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}

/* Stock card */
.stk-card{position:relative;padding:18px;cursor:pointer}
.stk-card .strip{position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r) var(--r) 0 0}
.stk-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.stk-tk{font-size:16px;font-weight:700;font-family:var(--mono);letter-spacing:.5px}
.stk-nm{font-size:12px;color:var(--tx-2);margin-top:2px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stk-pct{font-size:14px;font-weight:700;font-family:var(--mono)}
.stk-price{font-size:12px;color:var(--tx-2);font-family:var(--mono);margin-top:2px;text-align:right}
.stk-foot{display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px solid var(--border)}
.score-sm{display:flex;align-items:center;gap:6px}
.score-sm .lbl{font-size:11px;color:var(--tx-2)}
.score-sm .val{font-size:14px;font-weight:700;font-family:var(--mono)}

/* Features */
.feat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:1180px;margin:0 auto;padding:0 24px 64px}
@media(max-width:900px){.feat-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.feat-grid{grid-template-columns:1fr}}
.feat-card{padding:24px}
.feat-card .ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px;background:var(--ac-glow)}
.feat-card h3{font-size:14px;font-weight:700;margin-bottom:6px}
.feat-card p{font-size:12.5px;color:var(--tx-2);line-height:1.6}

/* CTA */
.cta{max-width:1180px;margin:0 auto;padding:0 24px 64px}
.cta-inner{text-align:center;padding:48px 32px;border-radius:var(--r-lg);background:var(--bg-2);border:1px solid var(--border)}
.cta-inner h3{font-size:20px;font-weight:800;margin:12px 0 8px}
.cta-inner p{font-size:13px;color:var(--tx-2);max-width:440px;margin:0 auto 24px;line-height:1.6}

/* Footer */
.land-foot{border-top:1px solid var(--border);padding:24px;text-align:center}
.land-foot p{font-size:11px;color:var(--tx-2);max-width:640px;margin:12px auto 0;line-height:1.6}

/* ─── Login ─── */
.login-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative}
.login-card{width:100%;max-width:400px;padding:40px 36px;border-radius:var(--r-lg);animation:fadeUp .5s ease;position:relative;z-index:1}
.login-card h2{font-family:var(--display);font-size:24px;font-weight:800;text-align:center;margin-bottom:4px}
.login-card .sub{text-align:center;font-size:13px;color:var(--tx-2);margin-bottom:28px}
.login-err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd);padding:10px 14px;border-radius:var(--r-sm);font-size:13px;margin-bottom:16px;display:none}
.sec-badge{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:20px;font-size:11px;color:var(--tx-2);font-family:var(--mono)}

/* ─── App Shell ─── */
.app{display:flex;min-height:100dvh}
.side{width:var(--sidebar);background:var(--bg-1);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;z-index:40;display:flex;flex-direction:column;transition:transform .3s ease}
.side-head{height:var(--topbar);padding:0 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.side-nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-sec{margin-bottom:14px}
.nav-sec-t{font-size:10px;font-weight:700;color:var(--tx-2);letter-spacing:2.5px;text-transform:uppercase;padding:6px 14px;margin-bottom:2px}
.nav-i{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r-sm);font-size:13px;font-weight:500;color:var(--tx-1);cursor:pointer;transition:all .15s;margin-bottom:1px}
.nav-i:hover{background:var(--ac-glow);color:var(--tx-0)}
.nav-i.on{background:var(--ac-glow);color:var(--ac);font-weight:600}
.nav-i .ico{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.side-foot{padding:14px 16px;border-top:1px solid var(--border);flex-shrink:0}
.main{flex:1;margin-left:var(--sidebar);min-height:100dvh}
.top{height:var(--topbar);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--bg-1);position:sticky;top:0;z-index:30;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top-l{display:flex;align-items:center;gap:12px}
.top-r{display:flex;align-items:center;gap:10px}
.ham{display:none;background:none;border:none;color:var(--tx-0);cursor:pointer;padding:2px}
.page{padding:24px;max-width:1400px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35;backdrop-filter:blur(2px)}
.overlay.on{display:block}

/* ─── Avatar ─── */
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}

/* ─── AI status ─── */
.ai-live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-family:var(--mono);color:var(--green);letter-spacing:.5px}
.ai-live .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}

/* ─── Currency select ─── */
.cur-sel{background:var(--bg-0);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 10px;color:var(--tx-0);font-size:12px;font-family:var(--mono);cursor:pointer}
.cur-sel:focus{outline:none;border-color:var(--ac)}

/* ─── Dashboard Tiles ─── */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
.tile{padding:20px;position:relative}
.tile-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.tile-lbl{font-size:11px;font-weight:600;color:var(--tx-2);text-transform:uppercase;letter-spacing:1.5px}
.tile-ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px}
.tile-val{font-size:30px;font-weight:800;font-family:var(--mono);line-height:1}
.tile-sub{font-size:12px;color:var(--tx-2);margin-top:6px}

/* ─── Stock List ─── */
.stk-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.stk-full{cursor:pointer}
.stk-full:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.15)}
.stk-full .top-area{padding:18px 18px 0}
.stk-full .bot-area{padding:10px 18px 18px}

/* Score bars */
.sbar{margin-bottom:6px}
.sbar-top{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
.sbar-track{height:4px;background:var(--bg-0);border-radius:2px;overflow:hidden}
.sbar-fill{height:100%;border-radius:2px;transition:width .7s ease}

/* ─── Stock Detail ─── */
.det-hero{padding:24px;border-radius:var(--r);margin-bottom:20px;position:relative;overflow:hidden}
.det-hero::before{content:'';position:absolute;inset:0;opacity:.03;background:linear-gradient(135deg,currentColor,transparent)}
.det-price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:12px}
.det-price .big{font-size:38px;font-weight:800;font-family:var(--mono);line-height:1}
.det-price .chg{font-size:17px;font-weight:700;font-family:var(--mono)}
.gauge{text-align:center;padding:24px}
.gauge-val{font-size:60px;font-weight:800;font-family:var(--mono);line-height:1}
.gauge-lbl{font-size:14px;font-weight:600;margin-top:6px}
.gauge-sub{font-size:11px;color:var(--tx-2);margin-top:2px}
.bdown-item{display:flex;gap:14px;padding:14px;background:var(--bg-0);border-radius:var(--r-sm);margin-bottom:8px}
.bdown-item .b-ico{font-size:18px;flex-shrink:0;margin-top:2px}

/* ── Performance History Generator ───────────────────────────────────── */
function generateHistory(days){
const history=[];
let d=lastWD();
for(let i=0;i<days;i++){
const ds=estStr(d);
const picks=dailyPicks(ds);
const wins=picks.filter(p=>p.dc>0).length;
const avg=picks.reduce((a,p)=>a+p.dc,0)/picks.length;
history.push({date:ds,dateObj:new Date(d),picks:picks.length,wins,losses:picks.length-wins,avg,topPick:picks.sort((a,b)=>b.dc-a.dc)[0],worstPick:picks.sort((a,b)=>a.dc-b.dc)[0],avgScore:Math.round(picks.reduce((a,p)=>a+p.score,0)/picks.length)});
d=prevWD(d);
}
return history;
}

/* ── Date helpers ─────────────────────────────────────────────────────── */
function estNow(){return new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'}))}
function estStr(d){return new Date(d.toLocaleString('en-US',{timeZone:'America/New_York'})).toISOString().split('T')[0]}
function fmtDate(d){return new Date(d).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
function isWD(d){const w=d.getDay();return w>0&&w<6}
function lastWD(){const d=estNow();while(!isWD(d))d.setDate(d.getDate()-1);return d}
function prevWD(d){const p=new Date(d);p.setDate(p.getDate()-1);while(!isWD(p))p.setDate(p.getDate()-1);return p}

/* ── Seeded PRNG ──────────────────────────────────────────────────────── */
function rng(seed){let s=0;for(let i=0;i<seed.length;i++){s=((s<<5)-s)+seed.charCodeAt(i);s|=0}return()=>{s^=s<<13;s^=s>>17;s^=s<<5;return(s>>>0)/4294967296}}

// ATLAS SCORING ENGINE — Weights Obfuscated
// ═════════════════════════════════════════════════════════════════════════
const _W=[0x19,0x14,0x0F,0x0F,0x0A,0x0A,0x05].map(x=>x/100);
const SC=[
{k:'momentum',l:'Momentum Indicator',d:'EMA crossover dynamics normalized against ATR volatility — measures trend strength and directional conviction relative to recent price range',ic:'📈'},
{k:'volume',l:'Volume Conviction',d:'Logarithmic volume ratio combined with On-Balance Volume derivative — captures institutional accumulation through volume-price confirmation patterns',ic:'📊'},
{k:'fundamental',l:'Fundamental Quality',d:'Free cash flow yield, earnings quality, and revenue growth composite — geometric mean approach evaluating financial health and growth trajectory',ic:'💰'},
{k:'sectorRS',l:'Sector Relative Strength',d:'Sector momentum relative to the broad market ceiling — identifies leading sectors with strong rotational dynamics and institutional capital flows',ic:'🎯'},
{k:'instFlow',l:'Institutional Flow',d:'13F filing delta combined with insider activity indicators — tracks smart money positioning through regulatory filings and anomalous volume detection',ic:'🏛️'},
{k:'catalyst',l:'Catalyst Density',d:'Time-decayed weighted news sentiment aggregation — measures upcoming catalyst density with exponential recency decay and sentiment scoring',ic:'⚡'},
{k:'riskAdj',l:'Risk-Adjusted Return',d:'Expected return over risk-free rate scaled by max drawdown — modified Sharpe metric that penalizes tail risk and excessive historical volatility',ic:'🛡️'}
];

function atlasScore(stk,dt){
const r=rng(stk.t+dt);
const live=livePrice(stk.t);
const base=stk.pe?Math.min(85,68+(1/stk.pe)*120):62;
const f={};
SC.forEach((c,i)=>{
let v=48+r()*36+(base-65)*.35;
// Use real Finnhub data to influence scores when available
if(live){
if(c.k==='momentum'){
// Real price change drives momentum — positive change = bullish momentum
v=55+live.pct*4+r()*15;
}
if(c.k==='volume'){
// If price moved significantly, volume conviction is higher
v=50+Math.abs(live.pct)*5+r()*20;
}
}else{
if(c.k==='momentum')v+=(stk.p-stk.lo)/(stk.hi-stk.lo)*18-9;
}
if(c.k==='fundamental')v+=stk.pe&&stk.pe<20?14:stk.pe&&stk.pe<35?6:-2;
if(c.k==='sectorRS')v+=r()*14;
if(!live&&c.k==='volume')v+=r()*10;
f[c.k]=Math.max(12,Math.min(98,Math.round(v)));
});
let s=0;SC.forEach((c,i)=>s+=_W[i]*f[c.k]);
return{score:Math.max(22,Math.min(97,Math.round(s))),factors:f};
}

// ═════════════════════════════════════════════════════════════════════════
// AI ANALYSIS ENGINE
// ═════════════════════════════════════════════════════════════════════════
const SRC=['Bloomberg','Yahoo Finance','Globe and Mail','X Analytics'];
const BULLS=['Strong institutional accumulation detected in recent 13F filings','Sector rotation dynamics favoring this industry group','Technical breakout above key resistance with confirming volume','Analyst consensus trending positive with upward estimate revisions','Management executing effectively on strategic growth initiatives','Revenue acceleration expected from upcoming product or contract cycles','Favorable regulatory environment developing in key markets','Margin expansion likely as operational efficiencies take hold','Robust free cash flow generation supporting shareholder returns','Insider buying activity elevated above historical norms'];
const BEARS=['Broader market volatility may create near-term headwinds','Current valuation leaves limited margin of safety for new positions','Competitive landscape intensifying from well-funded rivals','Currency fluctuations may impact reported earnings for multinationals','Rising cost of capital could pressure growth-stage business models','Sector rotation risk present if macro conditions shift materially','Execution risk on key development or production milestones','Regulatory uncertainty in core operating jurisdictions','Supply chain disruptions could compress gross margins','Short interest elevated — potential for increased selling pressure'];

function analyze(stk,dt){
const r=rng(stk.t+dt+'a');
const{score,factors}=atlasScore(stk,dt);
// Use real analyst recs to influence sentiment if available
const recs=realRecs(stk.t);
let sent;
if(recs&&recs.total>0){
const bullPct=(recs.buy/recs.total)*100;
if(bullPct>=75&&score>=65)sent='Strongly Bullish';
else if(bullPct>=55&&score>=55)sent='Bullish';
else if(bullPct>=35)sent='Neutral';
else if(score<45)sent='Bearish';
else sent='Cautious';
}else{
sent=score>=80?'Strongly Bullish':score>=65?'Bullish':score>=50?'Neutral':score>=35?'Cautious':'Bearish';
}
// Use LIVE price from Finnhub if available
const live=livePrice(stk.t);
let dc,cp;
if(live){cp=live.price;dc=live.pct;}
else{dc=(r()-.4)*6;cp=stk.p*(1+dc/100);}
const tm=score>=75?1.12+r()*.15:score>=55?1.05+r()*.1:.98+r()*.08;
const tp=cp*tm;
const sl=cp*(score>=70?.93:.90)-r()*cp*.02;
const th='1 week';

// NEWS — use real Finnhub headlines when available
const rn=realNews(stk.t);
let news=[];
if(rn&&rn.length>0){
news=rn.slice(0,6).map(n=>({src:n.source,hl:n.headline,tm:n.time,url:n.url,real:true,sentiment:n.sentiment}));
}else{
const nc=3+Math.floor(r()*3);
const hls=mkHeadlines(stk,r);
for(let i=0;i<nc;i++)news.push({src:SRC[Math.floor(r()*SRC.length)],hl:hls[i%hls.length],tm:Math.floor(r()*12+1)+'h ago',real:false});
}

// BULL/BEAR — enhance with real data indicators
const bl=[];const be=[];
if(rn&&rn.length>0){
const posNews=rn.filter(n=>n.sentiment==='positive');
const negNews=rn.filter(n=>n.sentiment==='negative');
if(posNews.length>0)bl.push('Recent positive news flow: "'+posNews[0].headline.substring(0,80)+(posNews[0].headline.length>80?'...':'')+'"');
if(posNews.length>2)bl.push('Multiple positive catalysts detected in news feed ('+posNews.length+' bullish articles in the past week)');
if(negNews.length>0)be.push('Recent negative coverage: "'+negNews[0].headline.substring(0,80)+(negNews[0].headline.length>80?'...':'')+'"');
if(negNews.length>2)be.push('Elevated negative sentiment in news flow ('+negNews.length+' bearish articles detected)');
}
if(recs&&recs.total>0){
if(recs.buy>recs.hold+recs.sell)bl.push(`Analyst consensus is bullish: ${recs.buy} Buy vs ${recs.hold} Hold and ${recs.sell} Sell ratings`);
if(recs.strongBuy>0)bl.push(`${recs.strongBuy} analysts rate Strong Buy — highest conviction level`);
if(recs.sell>recs.buy)be.push(`More analysts rate Sell (${recs.sell}) than Buy (${recs.buy}) — bearish consensus`);
if(recs.hold>recs.buy)be.push(`Analyst consensus skews cautious: ${recs.hold} Hold ratings vs ${recs.buy} Buy`);
}
// Fill remaining with template bulls/bears
const bi=new Set();while(bl.length<3){const j=Math.floor(r()*BULLS.length);if(!bi.has(j)){bi.add(j);bl.push(BULLS[j])}}
const ri2=new Set();while(be.length<2){const j=Math.floor(r()*BEARS.length);if(!ri2.has(j)){ri2.add(j);be.push(BEARS[j])}}

// SUMMARY — enhance with real data
const sum=mkSummary(stk,score,sent,r,recs,rn);
// Merge AI analysis when available
const ai=aiAnalysis(stk.t);
if(ai&&ai.analysis){
const a=ai.analysis;
if(a.sentiment)sent=a.sentiment;
if(a.bulls&&a.bulls.length)bl.splice(0,0,...a.bulls);
if(a.bears&&a.bears.length)be.splice(0,0,...a.bears);
if(a.summary)sum.summary=a.summary+(sum.summary.includes('Atlas Analysis engine')?' '+sum.summary.split('Atlas Analysis engine')[1]:'');
if(a.insight)sum.insight=a.insight;
}
return{score,factors,sent,dc,cp,tp,sl,th,news,bl,be,...sum,hasRealNews:!!(rn&&rn.length>0),hasRealRecs:!!(recs&&recs.total>0),hasAI:!!(ai&&ai.analysis)};
}

function mkHeadlines(s,r){
const h=[`${s.n} reports ahead-of-consensus quarterly performance metrics`,`Analyst maintains coverage on ${s.t} with revised outlook and target`,`${s.i} sector seeing renewed institutional interest amid rotation`,`${s.n} announces strategic initiative to expand addressable market`,`Market commentary highlights ${s.t} as potential beneficiary of sector trends`,`${s.n} management provides updated outlook at industry conference`,`Technical analysis identifies ${s.t} approaching key inflection point`,`Fund flow data shows rising allocations to ${s.i} names`,`${s.n} regulatory filings reveal notable insider transaction activity`,`Sector peers rally as ${s.i} group outperforms broader indices`];
for(let i=h.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[h[i],h[j]]=[h[j],h[i]]}
return h;
}

function mkSummary(s,sc,sent,r,recs,rn){
const peS=s.pe?`a trailing P/E of ${s.pe}`:'pre-revenue operations (no trailing earnings)';
const pos=((s.p-s.lo)/(s.hi-s.lo)*100).toFixed(0);
const live=livePrice(s.t);
const priceStr=live?'$'+live.price.toFixed(2):'$'+s.p.toFixed(2);

// Build summary with real data when available
let recStr='';
if(recs&&recs.total>0){
recStr=` Wall Street consensus stands at ${recs.buy} Buy, ${recs.hold} Hold, and ${recs.sell} Sell from ${recs.total} covering analysts.`;
}
let newsStr='';
if(rn&&rn.length>0){
newsStr=` Recent news flow includes ${rn.length} articles in the past week, with sentiment trending ${rn.filter(n=>n.sentiment==='positive').length>rn.filter(n=>n.sentiment==='negative').length?'positive':'mixed'}.`;
}

const summary=`${s.n} (${s.t}) trades on the ${s.x} at ${priceStr} in the ${s.i} sector with a market capitalization of ${s.mc}. The company currently carries ${peS} and sits ${pos}% above its 52-week low.${recStr}${newsStr} Our Atlas Analysis engine assigns a composite score of ${sc}/100 with a ${sent} outlook, derived from multi-factor quantitative analysis spanning momentum, volume conviction, fundamentals, sector dynamics, institutional positioning, catalyst density, and risk-adjusted return metrics.`;

const insight=`Our analysis indicates ${s.t} presents a ${sent.toLowerCase()} configuration in the current technical and fundamental environment. The ${s.i} sector is exhibiting ${sc>=65?'favorable':'mixed'} relative strength characteristics versus the broader market. Volume patterns suggest ${sc>=70?'accumulation':'distribution'} dynamics, while the momentum profile shows ${sc>=65?'strengthening':'consolidating'} directional conviction.${recs&&recs.total>0?' Institutional consensus from '+recs.total+' analysts '+(recs.buy>recs.sell?'supports':'does not strongly support')+' the current thesis.':' Institutional flow analysis from recent 13F filings '+(sc>=70?'supports the constructive thesis.':'warrants continued monitoring.')} The risk-adjusted return profile ${sc>=65?'compares favorably':'shows elevated risk'} relative to sector peers based on historical drawdown analysis.`;

const ann=[
s.pe?`Next earnings report expected within ${Math.floor(r()*45+15)} days — consensus estimates being ${sc>=65?'revised upward':'held steady'}`:`Key development milestone anticipated within ${Math.floor(r()*60+30)} days`,
`Annual shareholder meeting and strategic update scheduled approximately ${Math.floor(r()*30+30)} days out`,
sc>=70?'Potential catalyst: upcoming industry conference presentation may reveal new developments':'Monitoring sector regulatory developments for potential near-term impact'
];
return{summary,insight,ann};
}

function dailyPicks(dt){
// If AI rankings are available, use them — AI-driven stock selection
if(hasAIRankings()){
const picks=[];
Object.values(SEC).forEach(sec=>{
const rankings=AI_RANKINGS[sec.k];
if(rankings&&rankings.featured){
// Use AI-ranked featured stocks for this sector
rankings.featured.forEach(f=>{
const stk=sec.stk.find(s=>s.t===f.ticker);
if(stk){
const a=analyze(stk,dt);
const pos=f.direction||'Bullish';
picks.push({...stk,sec:sec.k,secL:sec.l,pos,strength:f.strength,...a});
}
});
}else{
// Sector not yet ranked — fall back to top 6 by local score
const scored=sec.stk.map(s=>({s,a:analyze(s,dt)})).sort((a,b)=>b.a.score-a.a.score);
scored.slice(0,6).forEach(({s,a})=>{
const pos=a.score>=55?'Bullish':'Bearish';
picks.push({...s,sec:sec.k,secL:sec.l,pos,...a});
});
}
});
return picks;
}

// Fallback: no AI rankings yet — use local scoring algorithm
const picks=[];
Object.values(SEC).forEach(sec=>{
const scored=sec.stk.map(s=>({s,a:analyze(s,dt)})).sort((a,b)=>b.a.score-a.a.score);
scored.slice(0,6).forEach(({s,a})=>{
const pos=a.score>=55?'Bullish':'Bearish';
picks.push({...s,sec:sec.k,secL:sec.l,pos,...a});
});
});
return picks;
}

async function doSignup(){

const pw2=document.getElementById('su-pw2').value;

if(!email||!email.includes('@')){err.textContent='Please enter the email you used for payment.';err.style.display='block';return}
if(pw.length<8){err.textContent='Password must be at least 8 characters.';err.style.display='block';return}
if(pw!==pw2){err.textContent='Passwords do not match.';err.style.display='block';return}

// Try server signup first (Supabase)
const sr=await serverAuth('signup',{name,email,password:pw});
if(sr.token&&sr.user){
setSess(sr.user,sr.token);
nav('/app/dashboard');
return;
}

// Fallback: local account creation
const existing=USERS.find(u=>u.email.toLowerCase()===email);
if(existing){err.textContent='An account with this email already exists. Please sign in instead.';err.style.display='block';return}
const h=await sha256(pw);
const newUser={id:'sub_'+Date.now(),email:email,name:name,role:'subscriber',hash:h};
USERS.push(newUser);
saveUserOverride(newUser.id,'e',email);
saveUserOverride(newUser.id,'h',h);
saveUserOverride(newUser.id,'n',name);
setSess(newUser);
nav('/app/dashboard');
}

async function doLogin(){
const em=document.getElementById('lem').value.trim().toLowerCase();
const pw=document.getElementById('lpw').value;
const err=document.getElementById('lerr');
if(!em||!pw){err.textContent='Please enter both email and password.';err.style.display='block';return}

// Try server auth first (Supabase)
const sr=await serverAuth('login',{email:em,password:pw});
if(sr.token&&sr.user){
setSess(sr.user,sr.token);
nav('/app/dashboard');
return;
}

// Fallback: check hardcoded users (founders/testers)
const h=await sha256(pw);
const u=USERS.find(u=>u.email.toLowerCase()===em&&u.hash===h);
if(!u){
err.textContent=sr.error||'Invalid email or password. Please try again.';
err.style.display='block';
return;
}
setSess(u);nav('/app/dashboard');
}

document.getElementById('ttog').onclick=function(){flipTheme()};
const nTog=document.getElementById('notif-tog');
if(nTog){nTog.onclick=async function(){
const now=alertsEnabled();
if(!now){const ok=await requestNotifPermission();if(!ok){alert('Please allow notifications in your browser to use alerts.');return}}
setAlertsEnabled(!now);render();
}}
document.getElementById('seb').onclick=function(){
const v=document.getElementById('ne').value.trim(),m=document.getElementById('em');
if(!v||!v.includes('@')){m.textContent='Enter a valid email.';m.style.color='var(--red)';m.style.display='block';return}
const u=USERS.find(u=>u.id===s.id);if(u){u.email=v;saveUserOverride(u.id,'e',v);setSess(u);m.textContent='Email updated!';m.style.color='var(--green)';m.style.display='block'}
};
document.getElementById('spb').onclick=async function(){
const c=document.getElementById('cp').value,n=document.getElementById('np').value,cf=document.getElementById('cfp').value,m=document.getElementById('pm');
if(!c){m.textContent='Enter current password.';m.style.color='var(--red)';m.style.display='block';return}
if(n.length<8){m.textContent='Min 8 characters.';m.style.color='var(--red)';m.style.display='block';return}
if(n!==cf){m.textContent='Passwords don\'t match.';m.style.color='var(--red)';m.style.display='block';return}
const h=await sha256(c),u=USERS.find(u=>u.id===s.id);
if(!u||u.hash!==h){m.textContent='Wrong current password.';m.style.color='var(--red)';m.style.display='block';return}
const nh=await sha256(n);u.hash=nh;saveUserOverride(u.id,'h',nh);
m.textContent='Password updated with 256-bit SHA-256!';m.style.color='var(--green)';m.style.display='block';
document.getElementById('cp').value='';document.getElementById('np').value='';document.getElementById('cfp').value='';
};
}

// INIT — Global function exports (needed for onclick handlers in HTML)
// ═════════════════════════════════════════════════════════════════════════
function FT(){flipTheme()}

// Alert handlers
function handleToggleGlobalAlerts(){
const now=alertsEnabled();
if(!now){
if(!('Notification' in window)){alert('Your browser does not support notifications.');return}
Notification.requestPermission().then(p=>{
if(p==='granted'){setAlertsEnabled(true);render()}
else{alert('Please allow notifications in your browser settings to use price alerts.')}
});return;
}
setAlertsEnabled(false);render();
}

function handleToggleStockAlert(ticker,tp,sl,cp){
const on=toggleAlert(ticker,tp,sl,cp);
const btn=document.getElementById('stk-alert');
if(btn){
btn.className='alert-tog '+(on?'on':'');
btn.innerHTML='<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 14.5c.7 0 1.3-.6 1.3-1.3H6.7c0 .7.6 1.3 1.3 1.3zM12.5 10.5V7c0-2.4-1.6-4.4-3.9-4.9V1.5a.6.6 0 00-1.2 0v.6C5.1 2.6 3.5 4.6 3.5 7v3.5L2.2 11.8v.4H13.8v-.4z"/></svg> '+(on?'Alert ON':'Alert OFF');
}
if(on&&!alertsEnabled()){setAlertsEnabled(true);if('Notification' in window)Notification.requestPermission()}
}

// Expose everything to global scope

// Admin: run daily AI analysis
window.runAllAnalysis=async function(){
const sectors=['mining','ai','tech','biotech','energy','defense','media','other'];
const el=document.getElementById('ai-trigger-status');
const btn=document.getElementById('ai-run-all');
if(btn)btn.disabled=true;
for(const sec of sectors){
if(el)el.innerHTML+='<div>⏳ Analyzing <strong>'+sec+'</strong>...</div>';
try{
const res=await fetch('/.netlify/functions/daily-analysis?sector='+sec);
const data=await res.json();
if(el)el.innerHTML+='<div style="color:var(--green)">✓ '+sec+': '+(data.analyzed||data.scanned||data.error||'done')+'</div>';
}catch(e){
if(el)el.innerHTML+='<div style="color:var(--red)">✗ '+sec+': '+e.message+'</div>';
}
}
if(el)el.innerHTML+='<div style="color:var(--ac);font-weight:700;margin-top:8px">✓ All sectors complete! Refresh the page to see AI analysis.</div>';
if(btn)btn.disabled=false;
};
window.checkAnalysisStatus=async function(){
const el=document.getElementById('ai-trigger-status');
try{
const res=await fetch('/.netlify/functions/daily-analysis?status=1');
const data=await res.json();
if(el)el.innerHTML='<pre style="white-space:pre-wrap">'+JSON.stringify(data,null,2)+'</pre>';
}catch(e){if(el)el.textContent='Error: '+e.message}
};
setTheme(theme());
loadUserOverrides();
window.addEventListener('hashchange',render);
// Load live FX rates then render
loadLiveRates().then(()=>{render()});
render(); // Render immediately with static rates, update when live rates arrive
// Dismiss loading screen
setTimeout(()=>{const ld=document.getElementById('loader');if(ld){ld.style.opacity='0';setTimeout(()=>ld.remove(),500)}},800);
// Fetch live prices (one call — server caches in Firebase)
fetchLivePrices();
// Fetch real news/recs (one call — server caches in Firebase)
setTimeout(()=>fetchRealData(),3000);
// Fetch AI analysis from Firebase
setTimeout(()=>fetchAIAnalysis(),5000);
// Refresh prices every 10 seconds
setInterval(fetchLivePrices,10000);
// Refresh news every 30 min
setInterval(fetchRealData,1800000);
// Refresh FX rates every 30 min
setInterval(()=>loadLiveRates().then(()=>{if(document.querySelector('.cur-sel'))render()}),1800000);
})();
