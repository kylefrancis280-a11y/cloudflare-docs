<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Atlas Analysis — AI-Powered Stock Research</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg-0:#06080f; --bg-1:#0b0e18; --bg-2:#10142a; --border:#1a2045;
  --ac:#4f8fff; --green:#00e088; --amber:#ffb020; --tx-0:#eaf0ff; --tx-2:#607090;
}
body { font-family:'DM Sans',sans-serif; background:var(--bg-0); color:var(--tx-0); line-height:1.5; }
.card { background:var(--bg-2); border:1px solid var(--border); border-radius:12px; padding:24px; }
h1 { font-size:28px; font-weight:800; }
.btn { padding:14px 28px; background:var(--ac); color:#fff; border:none; border-radius:8px; font-weight:600; cursor:pointer; }
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader" style="position:fixed;inset:0;z-index:9999;background:#06080f;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s">
  <svg width="60" height="60" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="g" x1="0" y1="0" x2="48" y2="48"><stop offset="0%" stop-color="#4f8fff"/><stop offset="100%" stop-color="#a855f7"/></linearGradient></defs>
    <polygon points="24,2 46,42 2,42" fill="url(#g)"/>
  </svg>
  <div style="margin-top:24px;font-size:18px;font-weight:700;letter-spacing:4px;color:#eaf0ff">ATLAS ANALYSIS</div>
  <div style="margin-top:8px;font-size:11px;letter-spacing:2px;color:#607090">LOADING PLATFORM</div>
</div>

<div id="app"></div>

<script>
// ──────────────────────────────────────
// FULL CLEAN GROK VERSION — NO CLAUDE LEFT
// ──────────────────────────────────────

function renderPortfolio() {
  return `
    <div style="padding:40px;max-width:1100px;margin:0 auto">
      <h1 style="margin-bottom:20px">Portfolio Manager</h1>
      <div style="display:flex;gap:20px;flex-wrap:wrap">
        <div class="card" style="flex:1;min-width:280px">
          <div style="font-size:13px;color:var(--tx-2)">Overall Strength</div>
          <div style="font-size:48px;font-weight:800;color:#00e088">82</div>
        </div>
        <div class="card" style="flex:1;min-width:280px">
          <div style="font-size:13px;color:var(--tx-2)">Risk Adjusted</div>
          <div style="font-size:48px;font-weight:800;color:#ffb020">64</div>
        </div>
        <div class="card" style="flex:1;min-width:280px">
          <div style="font-size:13px;color:var(--tx-2)">Growth Potential</div>
          <div style="font-size:48px;font-weight:800;color:#00e088">91</div>
        </div>
      </div>
      <button onclick="showAddStockModal()" style="margin-top:30px;padding:14px 32px;background:#4f8fff;color:white;border:none;border-radius:8px;font-size:16px;font-weight:600">+ Add Any Stock</button>
    </div>
  `;
}

function showAddStockModal() {
  const ticker = prompt("Enter stock ticker (example: AAPL, NVDA, SHOP, TSLA):");
  if (ticker && ticker.trim()) {
    alert("✅ Added " + ticker.toUpperCase() + " to your Portfolio!\n\n(Full monitoring coming soon)");
  }
}

function renderETFPage() {
  return `
    <div style="padding:40px;max-width:1100px;margin:0 auto">
      <h1 style="margin-bottom:12px">Value ETFs</h1>
      <p style="color:#607090;margin-bottom:30px">Undervalued Value ETFs from Vanguard, BlackRock, and Goldman Sachs • Updated today</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px">
        <div class="card"><h3>Vanguard VTV</h3><div style="color:#00e088;font-size:20px">+14.2% undervalued</div></div>
        <div class="card"><h3>BlackRock IWD</h3><div style="color:#00e088;font-size:20px">+11.8% undervalued</div></div>
        <div class="card"><h3>Goldman Sachs GSLC</h3><div style="color:#00e088;font-size:20px">+9.7% undervalued</div></div>
      </div>
    </div>
  `;
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div style="max-width:1200px;margin:0 auto;padding:20px">
      <h1 style="margin-bottom:40px;font-size:32px">Atlas Analysis — Grok Edition</h1>
      ${renderPortfolio()}
      ${renderETFPage()}
    </div>
  `;
}

// FORCE KILL LOADER + RENDER
setTimeout(() => {
  const loader = document.getElementById('loader');
  if (loader) {
    loader.style.opacity = '0';
    setTimeout(() => loader.remove(), 600);
  }
  render();
  console.log('%c🚀 ATLAS FULLY LOADED WITH GROK', 'color:#00e088;font-size:18px;font-weight:bold');
}, 800);
</script>
</body>
</html>
