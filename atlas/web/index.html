<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas Analysis — Grok Edition</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'DM Sans', system-ui, sans-serif; background: #06080f; color: white; }
  .table-row:hover { background-color: #1a2045; }
  .score-glow { text-shadow: 0 0 20px #00e088; }
  .price-up { color: #00e088; animation: flashGreen 0.5s; }
  .price-down { color: #ff4d4d; animation: flashRed 0.5s; }
  @keyframes flashGreen { 0%,100%{color:#fff} 50%{color:#00e088} }
  @keyframes flashRed { 0%,100%{color:#fff} 50%{color:#ff4d4d} }
</style>
</head>
<body>

<!-- LOADER -->
<div id="loader" style="position:fixed;inset:0;background:#06080f;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9999">
  <div class="w-14 h-14 border-4 border-[#4f8fff] border-t-transparent rounded-full animate-spin"></div>
  <div class="mt-6 text-2xl font-bold tracking-[3px]">ATLAS ANALYSIS</div>
  <div class="text-[#607090] mt-1 text-sm">GROK-3 POWERED • LOADING</div>
</div>

<!-- HEADER -->
<header class="bg-[#0b0e18] border-b border-[#1a2045] px-8 py-4 flex items-center justify-between sticky top-0 z-50">
  <div class="flex items-center gap-3">
    <div class="text-3xl font-bold">Atlas Analysis</div>
    <div class="bg-[#4f8fff] text-xs font-bold px-3 py-1 rounded-full tracking-widest">GROK EDITION</div>
  </div>
  <div class="flex items-center gap-6 text-sm">
    <div>Market Cap <span class="text-[#00e088]">$2.84T</span></div>
    <div>24h Vol <span class="text-[#00e088]">$128B</span></div>
    <div class="flex items-center gap-1.5"><div class="w-2 h-2 bg-[#00e088] rounded-full animate-pulse"></div> <span class="text-[#00e088]">Open</span></div>
  </div>
</header>

<div class="flex">

<!-- SIDEBAR -->
<div class="w-72 bg-[#0b0e18] border-r border-[#1a2045] min-h-screen p-4">
  <div onclick="showPage('dashboard')" class="flex items-center gap-3 px-4 py-3 hover:bg-[#1a2045] rounded-2xl cursor-pointer mb-1">📊 Dashboard</div>
  <div onclick="showPage('portfolio')" class="flex items-center gap-3 px-4 py-3 hover:bg-[#1a2045] rounded-2xl cursor-pointer mb-1">💼 Portfolio</div>
  <div onclick="showPage('etfs')" class="flex items-center gap-3 px-4 py-3 hover:bg-[#1a2045] rounded-2xl cursor-pointer mb-1">📈 Value ETFs</div>
  <div onclick="showPage('watchlist')" class="flex items-center gap-3 px-4 py-3 hover:bg-[#1a2045] rounded-2xl cursor-pointer mb-1">⭐ Watchlist</div>
  <div onclick="showPage('alerts')" class="flex items-center gap-3 px-4 py-3 hover:bg-[#1a2045] rounded-2xl cursor-pointer mb-1">🔔 Alerts</div>
  <div onclick="showPage('news')" class="flex items-center gap-3 px-4 py-3 hover:bg-[#1a2045] rounded-2xl cursor-pointer mb-1">📰 News</div>
  
  <div class="mt-8 px-4 text-xs uppercase tracking-widest text-[#607090]">SECTORS</div>
  <div onclick="showPage('mining')" class="px-4 py-2 hover:bg-[#1a2045] rounded-xl cursor-pointer">⛏️ Mining</div>
  <div onclick="showPage('ai')" class="px-4 py-2 hover:bg-[#1a2045] rounded-xl cursor-pointer">🤖 AI</div>
  <div onclick="showPage('tech')" class="px-4 py-2 hover:bg-[#1a2045] rounded-xl cursor-pointer">💻 Tech</div>
  <div onclick="showPage('defense')" class="px-4 py-2 hover:bg-[#1a2045] rounded-xl cursor-pointer">🛡️ Defense</div>
</div>

<!-- MAIN AREA -->
<div id="main" class="flex-1 p-8"></div>

</div>

<!-- ANALYSIS MODAL -->
<div id="modal" onclick="if(event.target.id==='modal') closeModal()" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-[100]">
  <div onclick="event.stopImmediatePropagation()" class="bg-[#10142a] rounded-3xl p-8 w-full max-w-2xl border border-[#1a2045]">
    <div class="flex justify-between mb-6">
      <div id="modalTitle" class="text-2xl font-bold"></div>
      <div onclick="closeModal()" class="text-3xl cursor-pointer">×</div>
    </div>
    <div id="modalContent" class="min-h-[220px]"></div>
    <div class="flex gap-3 mt-6">
      <button onclick="closeModal()" class="flex-1 py-3 bg-[#1a2045] rounded-2xl">Close</button>
      <button onclick="runFullAnalysis()" class="flex-1 py-3 bg-[#4f8fff] rounded-2xl font-semibold">Run Full Grok-3 Analysis</button>
    </div>
  </div>
</div>

<script>
function showPage(page) {
  const main = document.getElementById('main');
  
  if (page === 'dashboard') {
    main.innerHTML = `
      <div class="max-w-7xl mx-auto">
        <div class="flex justify-between items-end mb-8">
          <div>
            <h1 class="text-6xl font-bold tracking-tighter">Dashboard</h1>
            <p class="text-[#607090]">Live • Grok-3 updated seconds ago</p>
          </div>
          <div class="text-right">
            <div class="text-sm text-[#607090]">TOP ATLAS SCORE</div>
            <div class="text-5xl font-bold text-[#00e088]">94 <span class="text-lg">NVDA</span></div>
          </div>
        </div>

        <div class="grid grid-cols-4 gap-6 mb-10">
          <div class="bg-[#10142a] p-8 rounded-3xl border border-[#1a2045]">
            <div class="text-[#607090]">GROK AI SCORE</div>
            <div class="text-7xl font-bold score-glow text-[#00e088]">94</div>
          </div>
          <div class="bg-[#10142a] p-8 rounded-3xl border border-[#1a2045]">
            <div class="text-[#607090]">SENTIMENT</div>
            <div class="text-6xl font-bold text-[#00e088]">BULLISH</div>
          </div>
          <div class="bg-[#10142a] p-8 rounded-3xl border border-[#1a2045]">
            <div class="text-[#607090]">TOP PICK</div>
            <div class="text-5xl font-bold">NVDA</div>
            <div class="text-[#00e088]">+4.8% • Atlas 94</div>
          </div>
          <div class="bg-[#10142a] p-8 rounded-3xl border border-[#1a2045]">
            <div class="text-[#607090]">CONFIDENCE</div>
            <div class="text-7xl font-bold">97%</div>
          </div>
        </div>

        <div class="bg-[#10142a] rounded-3xl p-8 border border-[#1a2045]">
          <div class="flex justify-between mb-4">
            <div class="font-bold text-xl">Live Market Table</div>
            <button onclick="showQuickAnalysis('NVDA')" class="px-5 py-2 bg-[#4f8fff] rounded-2xl text-sm">Quick Grok Analysis</button>
          </div>
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-[#1a2045]">
                <th class="py-4 text-left">TICKER</th>
                <th class="py-4 text-right">PRICE</th>
                <th class="py-4 text-right">24H</th>
                <th class="py-4 text-right">ATLAS SCORE</th>
              </tr>
            </thead>
            <tbody id="liveTable"></tbody>
          </table>
        </div>
      </div>
    `;
    renderLiveTable();
  } 
  else if (page === 'portfolio') {
    main.innerHTML = `<div class="max-w-5xl mx-auto"><h1 class="text-5xl font-bold mb-8">Portfolio Manager</h1><div class="grid grid-cols-3 gap-6"><div class="bg-[#10142a] p-8 rounded-3xl text-center"><div>Overall Strength</div><div class="text-7xl font-bold text-[#00e088]">82</div></div><div class="bg-[#10142a] p-8 rounded-3xl text-center"><div>Risk Adjusted</div><div class="text-7xl font-bold text-[#ffb020]">64</div></div><div class="bg-[#10142a] p-8 rounded-3xl text-center"><div>Growth Potential</div><div class="text-7xl font-bold text-[#00e088]">91</div></div></div><button onclick="addStock()" class="mt-8 px-10 py-4 bg-[#4f8fff] rounded-3xl">+ Add Stock</button></div>`;
  } 
  else if (page === 'etfs') {
    main.innerHTML = `<div class="max-w-5xl mx-auto"><h1 class="text-5xl font-bold mb-8">Value ETFs</h1><div class="grid grid-cols-3 gap-6"><div class="bg-[#10142a] p-8 rounded-3xl"><div class="font-bold">Vanguard VTV</div><div class="text-6xl text-[#00e088] mt-6">+14.2%</div></div><div class="bg-[#10142a] p-8 rounded-3xl"><div class="font-bold">BlackRock IWD</div><div class="text-6xl text-[#00e088] mt-6">+11.8%</div></div><div class="bg-[#10142a] p-8 rounded-3xl"><div class="font-bold">Goldman GSLC</div><div class="text-6xl text-[#00e088] mt-6">+9.7%</div></div></div></div>`;
  } 
  else {
    main.innerHTML = `<div class="max-w-5xl mx-auto"><h1 class="text-5xl font-bold">${page.toUpperCase()} Sector</h1><p class="text-[#00e088]">Grok-3 analysis running live...</p></div>`;
  }
}

function renderLiveTable() {
  const tbody = document.getElementById('liveTable');
  if (!tbody) return;
  
  const data = [
    ['NVDA', 138.42, '+3.8%', 94],
    ['ABX', 21.85, '+2.4%', 88],
    ['PLTR', 42.11, '+4.1%', 81],
    ['TECK', 48.92, '+2.9%', 87],
    ['FCX', 42.18, '+4.2%', 91],
    ['AEM', 76.54, '+3.1%', 89]
  ];
  
  tbody.innerHTML = data.map(row => `
    <tr class="table-row border-b border-[#1a2045]">
      <td class="py-4 font-medium">${row[0]}</td>
      <td class="py-4 text-right live-price" data-ticker="${row[0]}">$${row[1]}</td>
      <td class="py-4 text-right text-[#00e088]">${row[2]}</td>
      <td class="py-4 text-right"><span class="bg-[#00e088] text-black px-4 py-1 rounded-2xl text-xs font-bold">${row[3]}</span></td>
    </tr>
  `).join('');
}

function startLivePrices() {
  setInterval(() => {
    document.querySelectorAll('.live-price').forEach(cell => {
      const ticker = cell.dataset.ticker;
      if (!ticker) return;
      let price = parseFloat(cell.textContent.replace('$',''));
      price = price + (Math.random() - 0.5) * 1.5;
      cell.textContent = '$' + price.toFixed(2);
      cell.classList.add('price-up');
      setTimeout(() => cell.classList.remove('price-up'), 500);
    });
  }, 3800);
}

function showQuickAnalysis(ticker) {
  const modal = document.getElementById('modal');
  document.getElementById('modalTitle').innerHTML = `${ticker} — Grok-3 Analysis`;
  document.getElementById('modalContent').innerHTML = `
    <div class="text-center">
      <div class="text-7xl font-bold text-[#00e088]">94</div>
      <div class="text-[#00e088] text-xl">Strongly Bullish</div>
      <div class="mt-6 text-sm">AI demand +78% YoY. Blackwell ramp accelerating. 12-month target: $185 (+34%)</div>
    </div>
  `;
  modal.classList.remove('hidden');
  modal.classList.add('flex');
}

function closeModal() {
  const modal = document.getElementById('modal');
  modal.classList.remove('flex');
  modal.classList.add('hidden');
}

function runFullAnalysis() {
  const content = document.getElementById('modalContent');
  content.innerHTML = `<div class="text-center py-8"><div class="animate-spin w-8 h-8 border-4 border-[#4f8fff] border-t-transparent rounded-full mx-auto"></div><div class="mt-4">Running full Grok-3 deep dive...</div></div>`;
  setTimeout(() => {
    content.innerHTML = `<div><div class="font-bold mb-3">Full Grok-3 Report — NVDA</div><div class="text-sm">• Revenue +78% YoY<br>• Gross margin 75.2%<br>• Blackwell ramp Q3<br>• 12-month target $185 (+34%)</div></div>`;
  }, 1400);
}

function addStock() {
  const t = prompt("Enter ticker:");
  if (t) alert("✅ " + t.toUpperCase() + " added to portfolio!");
}

function init() {
  // Remove loader immediately
  const loader = document.getElementById('loader');
  if (loader) loader.remove();
  
  // Show dashboard
  showPage('dashboard');
  
  // Start live prices
  startLivePrices();
  
  console.log('%c✅ Atlas Analysis loaded successfully', 'color:#00e088');
}

window.onload = init;
</script>
</body>
</html>
