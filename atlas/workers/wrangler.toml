name = "atlas-api"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# ── D1 Database ─────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "atlas"
database_id = "REPLACE_WITH_D1_ID"
migrations_dir = "migrations"

# ── KV (caches: prices, news, macro, etc.) ──────────────────────────────────
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_ID"

# ── Durable Objects (SSE price stream) ──────────────────────────────────────
[[durable_objects.bindings]]
name = "PRICE_STREAM"
class_name = "PriceStream"

[[migrations]]
tag = "v1"
new_classes = ["PriceStream"]

# ── Cron triggers ───────────────────────────────────────────────────────────
# 30 13 * * 1-5 → Daily Grok analysis at 8:30 AM EST
# */1 13-21 * * 1-5 → Price cache warm every minute during market hours
[triggers]
crons = ["*/1 13-21 * * 1-5", "30 13 * * 1-5"]

# ── Vars ────────────────────────────────────────────────────────────────────
[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://atlasanalysis.net,https://www.atlasanalysis.net"

# ── Secrets (set with `wrangler secret put`) ───────────────────────────────
# GROK_API_KEY          ← Required (your xAI key)
# POLYGON_API_KEY       ← Preferred real-time quotes
# FINNHUB_KEY           ← Fallback quotes
# FRED_API_KEY          ← Macro data
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET ← Required for payments
# RESEND_API_KEY        ← Email notifications
# SESSION_PEPPER        ← Password hashing
# ADMIN_BOOTSTRAP_TOKEN ← One-time bootstrap (optional)
